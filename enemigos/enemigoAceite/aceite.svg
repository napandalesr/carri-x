<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Degradado principal de profundidad del aceite de motor -->
    <radialGradient id="oilBodyGrad" cx="45%" cy="40%" r="55%" fx="38%" fy="32%">
      <stop offset="0%" stop-color="#2a3038"/>
      <stop offset="25%" stop-color="#14181c"/>
      <stop offset="65%" stop-color="#07090b"/>
      <stop offset="100%" stop-color="#020304"/>
    </radialGradient>

    <!-- Humedad filtrada en el asfalto (halo exterior) -->
    <radialGradient id="wetAsphaltGrad" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#05070a" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#0b0e12" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#12151a" stop-opacity="0"/>
    </radialGradient>

    <!-- Iridiscencia de hidrocarburos / película de petróleo (Efecto tornasol) -->
    <linearGradient id="petrolSheen1" x1="15%" y1="20%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#e01879" stop-opacity="0.75"/>
      <stop offset="22%" stop-color="#ff8c00" stop-opacity="0.7"/>
      <stop offset="48%" stop-color="#00e575" stop-opacity="0.65"/>
      <stop offset="74%" stop-color="#00b4d8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="petrolSheen2" x1="80%" y1="15%" x2="20%" y2="85%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#7b2cbf" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#ff007f" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffb703" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Brillo especular líquido -->
    <linearGradient id="specularGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#d0e8ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 1. Halo difuminado de absorción y humedad sobre el pavimento -->
  <path d="M 32 36 C 48 16, 84 18, 102 36 C 118 52, 122 78, 106 98 C 90 118, 54 122, 32 108 C 14 96, 6 78, 12 56 C 16 42, 22 46, 32 36 Z"
        fill="url(#wetAsphaltGrad)" />

  <!-- 2. Cuerpo orgánico y viscoso del charco de aceite -->
  <path d="M 35 40 C 48 22, 82 24, 98 40 C 114 55, 116 76, 102 94 C 88 112, 56 114, 36 102 C 18 90, 12 74, 18 54 C 22 42, 26 48, 35 40 Z"
        fill="url(#oilBodyGrad)"
        stroke="#11161b"
        stroke-width="1.5" />

  <!-- 3. Capa interior de profundidad espesa (petróleo denso) -->
  <path d="M 40 45 C 52 30, 78 32, 92 46 C 104 58, 106 74, 95 88 C 83 102, 56 104, 40 94 C 26 84, 22 70, 26 55 C 30 46, 33 50, 40 45 Z"
        fill="#040507"
        opacity="0.85" />

  <!-- 4. Ondas e iridiscencia de gasolina/petróleo (reflejo de arcoíris químico) -->
  <!-- Curva tornasol principal -->
  <path d="M 42 42 C 60 28, 86 34, 96 50 C 104 64, 98 84, 82 92 C 66 100, 44 94, 34 82 C 26 70, 28 54, 42 42 Z"
        fill="none"
        stroke="url(#petrolSheen1)"
        stroke-width="7"
        stroke-linecap="round"
        opacity="0.85" />

  <!-- Anillo tornasol secundario más fino para realismo óptico -->
  <path d="M 48 48 C 62 36, 80 40, 88 52 C 94 62, 90 76, 78 82 C 66 88, 48 84, 40 74 C 34 64, 36 54, 48 48 Z"
        fill="none"
        stroke="url(#petrolSheen2)"
        stroke-width="3.5"
        stroke-linecap="round"
        opacity="0.7" />

  <!-- 5. Reflejos especulares curvos de superficie líquida (Wet Glass Gloss) -->
  <!-- Reflejo principal superior izquierdo -->
  <path d="M 38 48 C 46 36, 64 34, 76 38 C 66 40, 52 44, 44 54 C 40 58, 36 56, 38 48 Z"
        fill="url(#specularGlint)" />

  <ellipse cx="44" cy="42" rx="7" ry="2.5" transform="rotate(-25 44 42)" fill="#ffffff" opacity="0.65" />
  <circle cx="56" cy="36" r="1.8" fill="#ffffff" opacity="0.8" />

  <!-- Reflejo secundario inferior derecho (menisco de tensión superficial) -->
  <path d="M 72 88 C 84 84, 94 76, 96 68 C 94 74, 86 80, 76 84 Z"
        fill="#ffffff"
        opacity="0.45" />

  <!-- 6. Gotas satélite desprendidas (salpicaduras del derrame) -->
  <!-- Gotita superior derecha -->
  <circle cx="106" cy="34" r="4" fill="url(#oilBodyGrad)" />
  <circle cx="105" cy="33" r="1.2" fill="#ffffff" opacity="0.6" />

  <!-- Gotita inferior izquierda -->
  <circle cx="20" cy="88" r="3.2" fill="url(#oilBodyGrad)" />
  <circle cx="19.2" cy="87.2" r="1" fill="#ffffff" opacity="0.55" />

  <!-- Gotita inferior derecha -->
  <circle cx="92" cy="108" r="2.8" fill="url(#oilBodyGrad)" />
  <circle cx="91.2" cy="107.4" r="0.8" fill="#ffffff" opacity="0.5" />

  <!-- Micro-gota aislada -->
  <circle cx="28" cy="30" r="2.2" fill="url(#oilBodyGrad)" />
</svg>
