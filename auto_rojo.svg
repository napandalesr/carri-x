<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 400" width="240" height="400">
  <defs>
    <!-- Gradiente Carrocería Rojo Fuego -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B71C1C"/>
      <stop offset="25%" stop-color="#E53935"/>
      <stop offset="50%" stop-color="#FF5252"/>
      <stop offset="75%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>

    <!-- Gradiente Parabrisas Polarizado -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#102027"/>
      <stop offset="50%" stop-color="#263238"/>
      <stop offset="100%" stop-color="#37474F"/>
    </linearGradient>

    <!-- Gradiente Llantas de Caucho Reforzado -->
    <linearGradient id="tireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>

    <!-- Gradiente Amarillo Tracción Extrema -->
    <linearGradient id="treadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#FF9100"/>
    </linearGradient>
  </defs>

  <!-- ========================================== -->
  <!-- LLANTAS ESPECIALES ANTI-ACEITE / ALTO AGARRE -->
  <!-- Con tacos y ranuras amarillas de tracción -->
  <!-- ========================================== -->

  <!-- Rueda Delantera Izquierda -->
  <g id="rueda_del_izq">
    <rect x="8" y="52" width="32" height="74" rx="8" fill="url(#tireGrad)" stroke="#111" stroke-width="2"/>
    <!-- Tacos de Tracción / Huella Antideslizante Amarilla -->
    <rect x="6" y="58" width="8" height="6" rx="2" fill="url(#treadGrad)"/>
    <rect x="6" y="70" width="8" height="6" rx="2" fill="url(#treadGrad)"/>
    <rect x="6" y="82" width="8" height="6" rx="2" fill="url(#treadGrad)"/>
    <rect x="6" y="94" width="8" height="6" rx="2" fill="url(#treadGrad)"/>
    <rect x="6" y="106" width="8" height="6" rx="2" fill="url(#treadGrad)"/>
    <rect x="6" y="116" width="8" height="5" rx="2" fill="url(#treadGrad)"/>
    <!-- Rin de Aleación Reforzado -->
    <rect x="15" y="66" width="18" height="46" rx="5" fill="#37474F" stroke="#FFD600" stroke-width="1.5"/>
    <circle cx="24" cy="89" r="4" fill="#FFD600"/>
  </g>

  <!-- Rueda Delantera Derecha -->
  <g id="rueda_del_der">
    <rect x="200" y="52" width="32" height="74" rx="8" fill="url(#tireGrad)" stroke="#111" stroke-width="2"/>
    <!-- Tacos de Tracción / Huella Antideslizante Amarilla -->
    <rect x="226" y="58" width="8" height="6" rx="2" fill="url(#treadGrad)"/>
    <rect x="226" y="70" width="8" height="6" rx="2" fill="url(#treadGrad)"/>
    <rect x="226" y="82" width="8" height="6" rx="2" fill="url(#treadGrad)"/>
    <rect x="226" y="94" width="8" height="6" rx="2" fill="url(#treadGrad)"/>
    <rect x="226" y="106" width="8" height="6" rx="2" fill="url(#treadGrad)"/>
    <rect x="226" y="116" width="8" height="5" rx="2" fill="url(#treadGrad)"/>
    <!-- Rin de Aleación Reforzado -->
    <rect x="207" y="66" width="18" height="46" rx="5" fill="#37474F" stroke="#FFD600" stroke-width="1.5"/>
    <circle cx="216" cy="89" r="4" fill="#FFD600"/>
  </g>

  <!-- Rueda Trasera Izquierda -->
  <g id="rueda_tras_izq">
    <rect x="8" y="272" width="32" height="76" rx="8" fill="url(#tireGrad)" stroke="#111" stroke-width="2"/>
    <!-- Tacos de Tracción Amarillos -->
    <rect x="6" y="278" width="8" height="6" rx="2" fill="url(#treadGrad)"/>
    <rect x="6" y="290" width="8" height="6" rx="2" fill="url(#treadGrad)"/>
    <rect x="6" y="302" width="8" height="6" rx="2" fill="url(#treadGrad)"/>
    <rect x="6" y="314" width="8" height="6" rx="2" fill="url(#treadGrad)"/>
    <rect x="6" y="326" width="8" height="6" rx="2" fill="url(#treadGrad)"/>
    <rect x="6" y="338" width="8" height="5" rx="2" fill="url(#treadGrad)"/>
    <!-- Rin de Aleación Reforzado -->
    <rect x="15" y="286" width="18" height="48" rx="5" fill="#37474F" stroke="#FFD600" stroke-width="1.5"/>
    <circle cx="24" cy="310" r="4" fill="#FFD600"/>
  </g>

  <!-- Rueda Trasera Derecha -->
  <g id="rueda_tras_der">
    <rect x="200" y="272" width="32" height="76" rx="8" fill="url(#tireGrad)" stroke="#111" stroke-width="2"/>
    <!-- Tacos de Tracción Amarillos -->
    <rect x="226" y="278" width="8" height="6" rx="2" fill="url(#treadGrad)"/>
    <rect x="226" y="290" width="8" height="6" rx="2" fill="url(#treadGrad)"/>
    <rect x="226" y="302" width="8" height="6" rx="2" fill="url(#treadGrad)"/>
    <rect x="226" y="314" width="8" height="6" rx="2" fill="url(#treadGrad)"/>
    <rect x="226" y="326" width="8" height="6" rx="2" fill="url(#treadGrad)"/>
    <rect x="226" y="338" width="8" height="5" rx="2" fill="url(#treadGrad)"/>
    <!-- Rin de Aleación Reforzado -->
    <rect x="207" y="286" width="18" height="48" rx="5" fill="#37474F" stroke="#FFD600" stroke-width="1.5"/>
    <circle cx="216" cy="310" r="4" fill="#FFD600"/>
  </g>

  <!-- ========================================== -->
  <!-- DEFLECTORES Y GUARDABARROS ANTISALPICADURA -->
  <!-- ========================================== -->
  <!-- Deflectores delanteros -->
  <path d="M 24 50 L 44 48 L 40 128 L 22 130 Z" fill="#212121" opacity="0.9"/>
  <path d="M 216 50 L 196 48 L 200 128 L 218 130 Z" fill="#212121" opacity="0.9"/>
  <!-- Deflectores traseros -->
  <path d="M 24 270 L 42 268 L 38 350 L 22 352 Z" fill="#212121" opacity="0.9"/>
  <path d="M 216 270 L 198 268 L 202 350 L 218 352 Z" fill="#212121" opacity="0.9"/>

  <!-- Faldones laterales aerodinámicos con reborde amarillo -->
  <rect x="30" y="140" width="8" height="120" fill="#1A1A1A"/>
  <rect x="30" y="140" width="2" height="120" fill="#FFD600"/>
  <rect x="202" y="140" width="8" height="120" fill="#1A1A1A"/>
  <rect x="208" y="140" width="2" height="120" fill="#FFD600"/>

  <!-- ========================================== -->
  <!-- CARROCERÍA PRINCIPAL (DEPORTIVO AGRESIVO) -->
  <!-- ========================================== -->
  <path d="M 120 25 
           C 74 25, 38 58, 36 118 
           L 32 292 
           C 32 355, 64 380, 120 380 
           C 176 380, 208 355, 208 292 
           L 204 118 
           C 202 58, 166 25, 120 25 Z" 
        fill="url(#bodyGrad)" stroke="#7F0000" stroke-width="4"/>

  <!-- Entradas de Aire en Capó -->
  <polygon points="68,55 92,55 88,72 64,72" fill="#151515" stroke="#B71C1C" stroke-width="1.5"/>
  <polygon points="172,55 148,55 152,72 176,72" fill="#151515" stroke="#B71C1C" stroke-width="1.5"/>

  <!-- DOBLE FRANJA DE TRACCIÓN (Negro Carbón y Amarillo Competición) -->
  <rect x="100" y="27" width="18" height="350" fill="#151515"/>
  <rect x="122" y="27" width="18" height="350" fill="#151515"/>
  <rect x="114" y="27" width="12" height="350" fill="url(#treadGrad)"/>

  <!-- SÍMBOLO DE TRACCIÓN / AGARRE EN EL CAPÓ -->
  <g transform="translate(120, 85)">
    <!-- Insignia circular de agarre -->
    <circle cx="0" cy="0" r="14" fill="#1A1A1A" stroke="#FFD600" stroke-width="2"/>
    <!-- Tres huellas de agarre en forma de garra -->
    <path d="M -7 -6 L -3 6 M 0 -8 L 0 8 M 7 -6 L 3 6" stroke="#FFD600" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Faros Delanteros LED Afilados -->
  <polygon points="46,40 82,38 76,62 42,56" fill="#FFFDE7" stroke="#FFEE58" stroke-width="2"/>
  <polygon points="194,40 158,38 164,62 198,56" fill="#FFFDE7" stroke="#FFEE58" stroke-width="2"/>
  <!-- Tira LED DRL Cyan -->
  <path d="M 46 42 L 80 40" stroke="#00E5FF" stroke-width="2" stroke-linecap="round"/>
  <path d="M 194 42 L 160 40" stroke="#00E5FF" stroke-width="2" stroke-linecap="round"/>

  <!-- Parabrisas Delantero Polarizado -->
  <path d="M 54 122 L 186 122 L 172 198 L 68 198 Z" fill="url(#glassGrad)" stroke="#111" stroke-width="3"/>
  <path d="M 62 130 L 178 130 L 168 168 L 72 168 Z" fill="#546E7A" opacity="0.35"/>

  <!-- Techo con Deflector de Flujo -->
  <path d="M 68 198 L 172 198 L 166 268 L 74 268 Z" fill="#990000"/>
  <line x1="120" y1="200" x2="120" y2="266" stroke="#FFD600" stroke-width="4"/>

  <!-- Ventana Trasera -->
  <path d="M 74 272 L 166 272 L 158 314 L 82 314 Z" fill="url(#glassGrad)" stroke="#111" stroke-width="2.5"/>

  <!-- Espejos Retrovisores con Detalle Amarillo -->
  <rect x="14" y="128" width="22" height="14" rx="4" fill="#B71C1C" stroke="#111" stroke-width="1.5"/>
  <rect x="14" y="138" width="22" height="3" fill="#FFD600"/>
  <rect x="204" y="128" width="22" height="14" rx="4" fill="#B71C1C" stroke="#111" stroke-width="1.5"/>
  <rect x="204" y="138" width="22" height="3" fill="#FFD600"/>

  <!-- ========================================== -->
  <!-- ALERÓN DEPORTIVO REFORZADO (ANTI-SLIP SPOILER) -->
  <!-- ========================================== -->
  <!-- Soportes del alerón -->
  <rect x="62" y="348" width="14" height="20" fill="#111"/>
  <rect x="164" y="348" width="14" height="20" fill="#111"/>
  <!-- Ala principal de fibra de carbono -->
  <rect x="36" y="356" width="168" height="16" rx="4" fill="#1A1A1A" stroke="#FFD600" stroke-width="1.5"/>
  <!-- Placas laterales del alerón (Endplates amarillas) -->
  <rect x="33" y="350" width="6" height="26" rx="2" fill="#FFD600"/>
  <rect x="201" y="350" width="6" height="26" rx="2" fill="#FFD600"/>
  <!-- Luces Traseras LED -->
  <rect x="44" y="375" width="38" height="5" rx="2" fill="#FF1744"/>
  <rect x="158" y="375" width="38" height="5" rx="2" fill="#FF1744"/>
</svg>
