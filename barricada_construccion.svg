<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 130" width="240" height="130">
  <defs>
    <!-- Gradiente del cuerpo del bloque de barrera -->
    <linearGradient id="cuerpo-barrera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#37474F"/>
      <stop offset="30%" stop-color="#455A64"/>
      <stop offset="85%" stop-color="#263238"/>
      <stop offset="100%" stop-color="#1A2226"/>
    </linearGradient>

    <!-- Patrón de franjas diagonales reflectantes de advertencia vial -->
    <pattern id="rayas-peligro" width="32" height="32" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect width="16" height="32" fill="#FF6D00"/>
      <rect x="16" width="16" height="32" fill="#FFFFFF"/>
    </pattern>

    <!-- Gradiente para conos de tráfico en vista superior -->
    <radialGradient id="cono-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="25%" stop-color="#FF5722"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#E64A19"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </radialGradient>
  </defs>

  <!-- SOMBRA REALISTA PROYECTADA EN EL ASFALTO -->
  <rect x="14" y="32" width="212" height="72" rx="10" fill="#05080C" opacity="0.55"/>
  
  <!-- CONOS DE TRÁFICO LATERALES (Vista cenital top-down) -->
  <!-- Cono Izquierdo -->
  <rect x="8" y="38" width="34" height="34" rx="4" fill="#D84315" stroke="#BF360C" stroke-width="2"/>
  <circle cx="25" cy="55" r="14" fill="url(#cono-grad)"/>
  <circle cx="25" cy="55" r="7.5" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="25" cy="55" r="3.5" fill="#FF6D00"/>

  <!-- Cono Derecho -->
  <rect x="198" y="38" width="34" height="34" rx="4" fill="#D84315" stroke="#BF360C" stroke-width="2"/>
  <circle cx="215" cy="55" r="14" fill="url(#cono-grad)"/>
  <circle cx="215" cy="55" r="7.5" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="215" cy="55" r="3.5" fill="#FF6D00"/>

  <!-- BLOQUE PESADO DE BARRERA VIAL TIPO JERSEY -->
  <rect x="36" y="22" width="168" height="70" rx="8" fill="url(#cuerpo-barrera)" stroke="#1C2529" stroke-width="3"/>

  <!-- PANEL CENTRAL DE FRANJAS REFLECTANTES DE SEGURIDAD VIAL -->
  <rect x="42" y="28" width="156" height="44" rx="5" fill="url(#rayas-peligro)" stroke="#263238" stroke-width="2"/>
  <!-- Línea de brillo reflectante superior -->
  <line x1="44" y1="30" x2="196" y2="30" stroke="#FFFFFF" stroke-width="2" opacity="0.75"/>

  <!-- ZÓCALO Y BISAGRAS DE UNIÓN DEL BLOQUE -->
  <rect x="40" y="74" width="160" height="14" rx="3" fill="#212121" opacity="0.7"/>
  <circle cx="48" cy="81" r="3.5" fill="#90A4AE" stroke="#37474F" stroke-width="1.5"/>
  <circle cx="120" cy="81" r="3.5" fill="#90A4AE" stroke="#37474F" stroke-width="1.5"/>
  <circle cx="192" cy="81" r="3.5" fill="#90A4AE" stroke="#37474F" stroke-width="1.5"/>

  <!-- BALIZAS LUMINOSAS ÁMBAR EN EXTREMOS SUPERIORES -->
  <!-- Baliza Izquierda -->
  <rect x="42" y="12" width="18" height="14" rx="4" fill="#263238" stroke="#1A2226" stroke-width="2"/>
  <circle cx="51" cy="19" r="7" fill="#FF8F00" stroke="#FFE082" stroke-width="2"/>
  <circle cx="51" cy="19" r="3" fill="#FFF9C4"/>

  <!-- Baliza Derecha -->
  <rect x="180" y="12" width="18" height="14" rx="4" fill="#263238" stroke="#1A2226" stroke-width="2"/>
  <circle cx="189" cy="19" r="7" fill="#FF8F00" stroke="#FFE082" stroke-width="2"/>
  <circle cx="189" cy="19" r="3" fill="#FFF9C4"/>

  <!-- CARTEL REFLECTANTE CENTRAL "OBRAS" -->
  <rect x="94" y="37" width="52" height="26" rx="4" fill="#1C2529" stroke="#FFD600" stroke-width="2"/>
  <text x="120" y="55" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#FFD600" text-anchor="middle" letter-spacing="1">OBRAS</text>
</svg>
