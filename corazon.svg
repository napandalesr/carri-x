<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="heartGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="40%" stop-color="#FF1744"/>
      <stop offset="85%" stop-color="#D50000"/>
      <stop offset="100%" stop-color="#8E0000"/>
    </radialGradient>
    <filter id="heartGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Glow -->
  <path d="M 64 108 C 20 75 10 48 26 28 C 40 10 58 22 64 34 C 70 22 88 10 102 28 C 118 48 108 75 64 108 Z" fill="#FF5252" opacity="0.3" filter="url(#heartGlow)"/>
  <!-- Base Heart -->
  <path d="M 64 104 C 22 72 12 46 28 26 C 42 8 59 20 64 32 C 69 20 86 8 100 26 C 116 46 106 72 64 104 Z" fill="url(#heartGrad)" stroke="#FF8A80" stroke-width="3"/>
  <!-- Highlight -->
  <path d="M 34 28 C 42 16 54 22 58 30" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
</svg>
