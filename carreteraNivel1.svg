<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 1080" width="648" height="1080">
  <defs>
    <!-- Patrón para las líneas punteadas centrales que se repiten verticalmente -->
    <pattern id="lineasCentro" width="648" height="120" patternUnits="userSpaceOnUse">
      <!-- Línea divisoria central (Separación de los 2 carriles en X=324) -->
      <rect x="318" y="20" width="12" height="60" fill="#FFFFFF" rx="4" opacity="0.9" />
    </pattern>

    <!-- Gradiente suave para el fondo del asfalto -->
    <linearGradient id="asfaltoGradiente" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1C20" />
      <stop offset="50%" stop-color="#24272C" />
      <stop offset="100%" stop-color="#1A1C20" />
    </linearGradient>

    <!-- Sombra interior de las bermas laterales -->
    <linearGradient id="sombraBordeIzq" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sombraBordeDer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- 1. Fondo de césped / arcén lateral -->
  <rect x="0" y="0" width="648" height="1080" fill="#2D4A27" />

  <!-- 2. Superficie principal del Asfalto (Carretera) -->
  <rect x="48" y="0" width="552" height="1080" fill="url(#asfaltoGradiente)" />

  <!-- 3. Líneas amarillas contínuas de seguridad en los bordes -->
  <rect x="56" y="0" width="10" height="1080" fill="#FFC107" />
  <rect x="582" y="0" width="10" height="1080" fill="#FFC107" />

  <!-- 4. Sombras de profundidad sobre el asfalto -->
  <rect x="66" y="0" width="30" height="1080" fill="url(#sombraBordeIzq)" />
  <rect x="552" y="0" width="30" height="1080" fill="url(#sombraBordeDer)" />

  <!-- 5. Líneas punteadas divisorias del centro (2 Carriles) -->
  <rect x="0" y="0" width="648" height="1080" fill="url(#lineasCentro)" />
</svg>
