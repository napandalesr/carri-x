<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="coinGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="40%" stop-color="#FBC02D"/>
      <stop offset="85%" stop-color="#F57F17"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>
    <radialGradient id="innerGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="50%" stop-color="#FDD835"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Glow -->
  <circle cx="64" cy="64" r="56" fill="#FFD54F" opacity="0.3" filter="url(#glow)"/>
  <!-- Outer Ring -->
  <circle cx="64" cy="64" r="52" fill="url(#coinGrad)" stroke="#FFE082" stroke-width="3"/>
  <!-- Inner Ring -->
  <circle cx="64" cy="64" r="42" fill="url(#innerGrad)" stroke="#F57F17" stroke-width="2"/>
  <!-- Center Star -->
  <polygon points="64,28 73,48 95,50 78,65 83,86 64,74 45,86 50,65 33,50 55,48" fill="#FFF59D" stroke="#E65100" stroke-width="1.5"/>
</svg>
