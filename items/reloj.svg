<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="clockBg" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="60%" stop-color="#26C6DA"/>
      <stop offset="100%" stop-color="#006064"/>
    </radialGradient>
    <radialGradient id="goldRim" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="50%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </radialGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Glow -->
  <circle cx="64" cy="68" r="48" fill="#80DEEA" opacity="0.3" filter="url(#cyanGlow)"/>
  <!-- Top Ring Holder -->
  <circle cx="64" cy="18" r="10" fill="none" stroke="url(#goldRim)" stroke-width="4"/>
  <rect x="60" y="24" width="8" height="8" fill="url(#goldRim)"/>
  <!-- Clock Body Rim -->
  <circle cx="64" cy="68" r="46" fill="url(#goldRim)" stroke="#FFE082" stroke-width="2"/>
  <!-- Clock Face -->
  <circle cx="64" cy="68" r="38" fill="url(#clockBg)" stroke="#004D40" stroke-width="2"/>
  <!-- Ticks -->
  <line x1="64" y1="34" x2="64" y2="40" stroke="#E0F7FA" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="96" x2="64" y2="102" stroke="#E0F7FA" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="68" x2="36" y2="68" stroke="#E0F7FA" stroke-width="3" stroke-linecap="round"/>
  <line x1="92" y1="68" x2="98" y2="68" stroke="#E0F7FA" stroke-width="3" stroke-linecap="round"/>
  <!-- Clock Hands -->
  <line x1="64" y1="68" x2="64" y2="46" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="68" x2="82" y2="68" stroke="#FFEB3B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="68" r="4" fill="#FFFFFF"/>
</svg>
