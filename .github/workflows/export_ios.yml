name: Exportar iOS para App Store

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: '¿Subir automáticamente a TestFlight / App Store Connect?'
        required: false
        type: boolean
        default: false
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-ios:
    name: Compilar y Firmar iOS (.IPA)
    runs-on: macos-14

    env:
      GODOT_VERSION: "4.7.2"
      EXPORT_PRESET_NAME: "iOS"
      SCHEME_NAME: "CarrilX"
      PROJECT_DIR: "."

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔐 Instalar Certificado de Distribución y Provisioning Profile de Apple
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporal_build_keychain_123' }}
        run: |
          # 1. Crear llavero temporal en macOS
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 2. Importar certificado .p12
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/build_certificate.p12
          security import $RUNNER_TEMP/build_certificate.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 3. Instalar Provisioning Profile (.mobileprovision)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          echo "Certificado y perfil instalados correctamente."

      - name: 🕹️ Descargar Godot Engine y Plantillas de Exportación
        run: |
          echo "Descargando Godot v${GODOT_VERSION}..."
          curl -sL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip" -o godot.zip
          unzip -q godot.zip
          mkdir -p /usr/local/bin
          sudo mv Godot.app/Contents/MacOS/Godot /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          echo "Descargando plantillas de exportación..."
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATES_DIR"
          curl -sL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
          unzip -q templates.tpz -d "$RUNNER_TEMP/templates_unzipped"
          mv "$RUNNER_TEMP/templates_unzipped/templates"/* "$TEMPLATES_DIR/"
          echo "Godot y plantillas listos."

      - name: 🛠️ Exportar Proyecto Godot a Proyecto Xcode
        run: |
          mkdir -p build/ios
          godot --headless --export-release "${EXPORT_PRESET_NAME}" build/ios/${SCHEME_NAME}.xcodeproj

      - name: 📦 Compilar Archivo con Xcode (xcodebuild archive)
        run: |
          cd build/ios
          
          # Detectar el nombre real del .xcodeproj y scheme si varía
          PROJECT_FILE=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -list -project "$PROJECT_FILE" | grep -A 1 "Schemes:" | tail -n 1 | tr -d ' ')
          echo "Proyecto detectado: $PROJECT_FILE con esquema: $SCHEME"
          
          xcodebuild -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/CarrilX.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=YES

      - name: ✍️ Empaquetar y Firmar .IPA para App Store
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          cd build/ios
          
          # Crear ExportOptions.plist para App Store
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.carrilx.carrilx</key>
                  <string>${PROVISIONING_PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF

          mkdir -p output
          PROJECT_FILE=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          xcodebuild -exportArchive \
            -archivePath "$PWD/CarrilX.xcarchive" \
            -exportPath "$PWD/output" \
            -exportOptionsPlist ExportOptions.plist

          echo "IPA generado exitosamente en build/ios/output/"

      - name: 📦 Empaquetar IPA alternativo (si no hay secretos de firma aún)
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 == '' || secrets.BUILD_PROVISION_PROFILE_BASE64 == '' }}
        run: |
          cd build/ios
          mkdir -p output/Payload
          APP_DIR=$(find CarrilX.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          cp -R "$APP_DIR" output/Payload/
          cd output
          zip -q -r "CarrilX_unsigned.ipa" Payload
          rm -rf Payload
          echo "IPA sin firmar generado para pruebas."

      - name: 🚀 Subir IPA como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: CarrilX-iOS-Build
          path: build/ios/output/*.ipa
          retention-days: 14

      - name: 🚀 Subir a TestFlight / App Store Connect (Opcional)
        if: ${{ github.event.inputs.upload_to_testflight == 'true' && secrets.APP_STORE_CONNECT_API_KEY_P8 != '' }}
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          
          IPA_PATH=$(find build/ios/output -name "*.ipa" | head -n 1)
          echo "Subiendo $IPA_PATH a App Store Connect..."
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: 🧹 Limpiar Llavero temporal
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/build.keychain-db 2>/dev/null || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision 2>/dev/null || true

